<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#0B2E5E"/>

  <!-- Back house: ice blue, smaller, upper left -->
  <g transform="translate(14,16)">
    <path d="M 0 20 L 20 4 L 40 20 V 40 H 0 Z" fill="#A8D4F5"/>
    <rect x="16" y="26" width="8" height="14" fill="#0B2E5E"/>
  </g>

  <!-- Front house: sky blue, larger, lower right, overlapping -->
  <g transform="translate(42,44)">
    <path d="M 0 24 L 24 4 L 48 24 V 48 H 0 Z" fill="#2D7DD2"/>
    <rect x="19" y="30" width="10" height="18" fill="#0B2E5E"/>
  </g>

  <!-- Route connecting the two properties -->
  <path d="M 32 40 Q 44 36 44 46" stroke="#EEF6FD" stroke-width="2.5" stroke-dasharray="1 6" stroke-linecap="round" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Mover-Exchange icon mark: two arrows in perpetual exchange, doubling as a two-lane route -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#0B2E5E"/>

  <!-- Top arrow: sky blue, pointing right -->
  <path d="M 22 36 H 62 M 22 36 V 48"
        stroke="#2D7DD2" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 55 27 L 68 36 L 55 45 Z" fill="#2D7DD2"/>

  <!-- Bottom arrow: ice blue, pointing left -->
  <path d="M 78 64 H 38 M 78 64 V 52"
        stroke="#A8D4F5" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 45 73 L 32 64 L 45 55 Z" fill="#A8D4F5"/>
</svg>
